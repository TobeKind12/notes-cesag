{% extends "base.html" %}
{% block title %}Connexion — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="text-center mb-4">
      <h1 class="h3">{{ APP_NAME }}</h1>
      <p class="text-muted">Envoi sécurisé des notes aux étudiants.</p>
    </div>

    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#login">Connexion</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#signup">Créer un compte</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#reset">Mot de passe oublié</button></li>
    </ul>

    <div class="tab-content border border-top-0 p-4 bg-white">
      <div class="tab-pane fade show active" id="login">
        <form method="post" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">Adresse e-mail</label>
            <input type="email" name="email" class="form-control" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary" type="submit">Se connecter</button>
        </form>
      </div>

      <div class="tab-pane fade" id="signup">
        <form method="post" action="{{ url_for('signup') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">Votre nom (affiché aux étudiants)</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Adresse e-mail</label>
            <input type="email" name="email" class="form-control" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe (8 caractères min.)</label>
            <input type="password" name="password" class="form-control" required minlength="8" autocomplete="new-password">
          </div>
          <button class="btn btn-success" type="submit">Créer le compte</button>
        </form>
      </div>

      <div class="tab-pane fade" id="reset">
        <form method="post" action="{{ url_for('reset_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">Adresse e-mail du compte</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <button class="btn btn-outline-primary" type="submit">Envoyer le lien de réinitialisation</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
